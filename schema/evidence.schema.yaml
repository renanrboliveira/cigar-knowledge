$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cigar-knowledge.local/schema/evidence.schema.yaml
type: object
required:
  - schemaVersion
  - evidence
additionalProperties: false
properties:
  schemaVersion:
    $ref: https://cigar-knowledge.local/schema/common.schema.yaml#/$defs/schemaVersion
  evidence:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - sourceId
        - field
        - relation
        - confidence
        - claimType
        - status
      additionalProperties: false
      properties:
        sourceId:
          $ref: https://cigar-knowledge.local/schema/common.schema.yaml#/$defs/slug
        field:
          type: string
          minLength: 1
          pattern: ^/
        relation:
          type: string
          enum:
            - supports
            - contradicts
            - mentions
        confidence:
          type: string
          enum:
            - high
            - medium
            - low
        claimType:
          type: string
          enum:
            - fact
            - manufacturer_claim
            - sensory_description
            - expert_consensus
            - personal_observation
            - hypothesis
        status:
          $ref: https://cigar-knowledge.local/schema/common.schema.yaml#/$defs/evidenceStatus
        rawLabel:
          type: string
        note:
          type: string
